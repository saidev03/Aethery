<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethery | Multimedia Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cursor Q'Zero Linux con Delay -->
  <div id="custom-cursor"></div>

  <div class="card-container">
    <h1 class="logo">AETHERY</h1>
    <p class="subtitle">Manejador Multimedia</p>

    <div id="auth-form" style="width: 100%;">
      <div class="input-group">
        <input type="text" id="access-key" class="input-field" placeholder="Llave de Acceso Única (AETH-...)" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="text" id="username" class="input-field" placeholder="Usuario" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="password" id="password" class="input-field" placeholder="Contraseña">
      </div>

      <button id="btn-submit-auth" class="btn btn-primary">Ingresar / Registrarse</button>
      
      <!-- Notificación integrada sin alertas feas de navegador -->
      <div id="status-msg" class="toast-msg"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
