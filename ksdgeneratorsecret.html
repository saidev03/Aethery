<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethery | Generador Secreto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="custom-cursor"></div>

  <div class="card-container">
    <h1 class="logo">AETHERY</h1>
    <p class="subtitle">Generador de Llaves Únicas</p>

    <div class="input-group">
      <input type="password" id="master-pass" class="input-field" placeholder="Contraseña Maestra">
    </div>

    <button id="btn-generate" class="btn btn-primary">Generar Llave de Acceso</button>

    <div id="status-msg" class="toast-msg"></div>

    <div id="key-result-box" style="display: none; width: 100%;">
      <div class="key-display-box">
        <span id="generated-key" class="key-code">AETH-000000</span>
        <button id="btn-copy" class="btn-copy">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    // Cursor Fluido a 60 FPS e Inercia
    const cursor = document.getElementById("custom-cursor");
    let mouseX = -100, mouseY = -100;
    let cursorX = -100, cursorY = -100;
    let isCursorInitialized = false;

    window.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!isCursorInitialized) {
        cursorX = mouseX;
        cursorY = mouseY;
        cursor.classList.add("visible");
        isCursorInitialized = true;
      }
    });

    document.addEventListener("mouseleave", () => cursor.classList.remove("visible"));
    document.addEventListener("mouseenter", () => cursor.classList.add("visible"));

    function animateCursor() {
      if (isCursorInitialized) {
        cursorX += (mouseX - cursorX) * 0.2;
        cursorY += (mouseY - cursorY) * 0.2;
        cursor.style.left = `${cursorX}px`;
        cursor.style.top = `${cursorY}px`;
      }
      requestAnimationFrame(animateCursor);
    }
    requestAnimationFrame(animateCursor);

    // Generador de Llaves
    const btnGenerate = document.getElementById("btn-generate");
    const masterPassInput = document.getElementById("master-pass");
    const keyResultBox = document.getElementById("key-result-box");
    const generatedKeyText = document.getElementById("generated-key");
    const btnCopy = document.getElementById("btn-copy");
    const statusMsg = document.getElementById("status-msg");

    function showStatus(text, isError = false) {
      statusMsg.innerText = text;
      statusMsg.className = `toast-msg ${isError ? 'toast-error' : 'toast-success'}`;
      statusMsg.style.display = "block";
    }

    btnGenerate.addEventListener("click", async () => {
      const pass = masterPassInput.value.trim();
      statusMsg.style.display = "none";
      
      if (!pass) {
        showStatus("Ingresa la contraseña maestra.", true);
        return;
      }

      try {
        const res = await fetch("/api/generate-key", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pass })
        });

        const data = await res.json();

        if (data.success) {
          generatedKeyText.innerText = data.key;
          keyResultBox.style.display = "block";
          showStatus("¡Llave generada con éxito!");
        } else {
          showStatus(data.error || "Contraseña incorrecta.", true);
        }
      } catch (err) {
        showStatus("Error conectando al servidor.", true);
      }
    });

    btnCopy.addEventListener("click", () => {
      const key = generatedKeyText.innerText;
      navigator.clipboard.writeText(key).then(() => {
        btnCopy.innerText = "¡Copiado!";
        setTimeout(() => { btnCopy.innerText = "Copiar"; }, 2000);
      });
    });
  </script>
</body>
</html>
