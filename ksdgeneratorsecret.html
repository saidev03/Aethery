<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethery | Secret Key Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="custom-cursor"></div>

  <div class="card-container">
    <h1 class="logo">AETHERY</h1>
    <p class="subtitle">Generador de Llaves Únicas</p>

    <div class="input-group">
      <input type="password" id="master-pass" class="input-field" placeholder="Contraseña Maestra">
    </div>

    <button id="btn-generate" class="btn btn-primary">Generar Llave Única</button>

    <div id="key-result" style="margin-top: 1.5rem; display: none;">
      <p style="color: var(--text-muted); font-size: 0.85rem;">Tu llave de acceso es:</p>
      <h2 id="generated-key" style="color: #fff; letter-spacing: 2px; margin-top: 0.4rem; font-family: monospace;">-</h2>
    </div>
  </div>

  <script>
    // Cursor 120 FPS
    const cursor = document.getElementById("custom-cursor");
    window.addEventListener("mousemove", (e) => {
      requestAnimationFrame(() => {
        cursor.style.left = `${e.clientX}px`;
        cursor.style.top = `${e.clientY}px`;
      });
    });

    // Petición al backend en Render
    const btnGenerate = document.getElementById("btn-generate");
    const masterPassInput = document.getElementById("master-pass");
    const keyResult = document.getElementById("key-result");
    const generatedKeyText = document.getElementById("generated-key");

    btnGenerate.addEventListener("click", async () => {
      const pass = masterPassInput.value.trim();
      
      if (pass !== "cat123") {
        alert("Contraseña maestra incorrecta.");
        return;
      }

      try {
        const res = await fetch("/api/generate-key", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pass })
        });

        const data = await res.json();

        if (data.success) {
          generatedKeyText.innerText = data.key;
          keyResult.style.display = "block";
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Error de conexión con el servidor.");
      }
    });
  </script>
</body>
</html>
